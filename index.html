<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gaming Lounge Manager - نظام إدارة صالات الألعاب</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#090d16">
    <link rel="icon" href="https://img.icons8.com/color/96/play-station.png">
    
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-green: #059669;
            --accent-red: #dc2626;
            --accent-blue: #0284c7;
            --whatsapp-green: #25d366;
            --border-color: #1f2937;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; }
        .auth-container { max-width: 420px; margin: 40px auto; background: var(--card-bg); padding: 35px; border-radius: 20px; border: 1px solid var(--border-color); box-shadow: 0 15px 35px rgba(0,0,0,0.6); text-align: center; }
        .auth-container h2 { color: var(--accent-blue); margin-top: 0; margin-bottom: 20px; font-size: 22px; }
        input, select, button { width: 100%; padding: 10px; margin-top: 8px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 13px; background: #030712; color: #fff; box-sizing: border-box; outline: none; }
        button.main-btn { background: var(--accent-blue); color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; padding: 12px; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD09gwJiZ76_Nc58qsgCuspDtbe8QgdLOIU",
            authDomain: "ps-manager-ce7cd.firebaseapp.com",
            projectId: "ps-manager-ce7cd",
            storageBucket: "ps-manager-ce7cd.firebasestorage.app",
            messagingSenderId: "826722012054",
            appId: "1:826722012054:web:91b422a1de8fec7517ab87",
            measurementId: "G-12E35W10WX"
        };

        let db = null;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            console.log("Firebase initialized successfully.");
        } catch (err) {
            console.error("Firebase initialization failed:", err);
        }

        const ADMIN_USER = "admin_master_secure_99";
        const ADMIN_PASS = "G#9mP!2$vK9xL*";

        window.login = async function() {
            let uEl = document.getElementById('username');
            let pEl = document.getElementById('password');
            let err = document.getElementById('login-error');
            err.innerText = "";

            if (!uEl || !pEl) return;
            let u = uEl.value.trim();
            let p = pEl.value.trim();

            if (!u || !p) {
                err.innerText = "الرجاء إدخال اسم الصالة وكلمة المرور";
                return;
            }

            // فحص الإدارة العامة أولاً بشكل مباشر ومستقل
            if (u === ADMIN_USER && p === ADMIN_PASS) {
                alert("تم تسجيل دخول الإدارة العامة بنجاح!");
                localStorage.setItem('ps_current_salon', JSON.stringify({ name: "الادارة العامة", role: "superadmin" }));
                location.reload();
                return;
            }

            if (!db) {
                err.innerText = "خطأ: لم يتم الاتصال بقاعدة البيانات (Firebase Load Error). تحقق من الإنترنت أو مانع الإعلانات.";
                return;
            }

            try {
                let docRef = doc(db, "salons", u);
                let docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    let salonData = docSnap.data();
                    if (salonData.password === p) {
                        alert("تم تسجيل دخول الصالة بنجاح!");
                        localStorage.setItem('ps_current_salon', JSON.stringify({ name: u, role: "salon" }));
                        location.reload();
                    } else {
                        err.innerText = "كلمة المرور غير صحيحة!";
                    }
                } else {
                    err.innerText = "اسم الصالة غير موجود في قاعدة البيانات!";
                }
            } catch (e) {
                err.innerText = "خطأ تقني أثناء الاتصال: " + e.message;
                console.error(e);
            }
        }
    </script>
</head>
<body>

    <div id="auth-screen" class="auth-container">
        <img src="https://img.icons8.com/color/96/play-station.png" alt="Icon" style="width: 64px; margin-bottom: 10px;">
        <h2>تسجيل دخول الصالة / المركز</h2>
        <input type="text" id="username" placeholder="اسم الصالة أو اسم المستخدم">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button class="main-btn" onclick="login()">دخول النظام</button>
        <div id="login-error" style="color: var(--accent-red); margin-top: 10px; font-size: 13px; font-weight: bold;"></div>
    </div>

</body>
</html>
